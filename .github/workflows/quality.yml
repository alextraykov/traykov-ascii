name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      - name: Upload browser contract evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-contract-evidence
          path: audit-artifacts/browser-contract
          if-no-files-found: ignore
          retention-days: 7
