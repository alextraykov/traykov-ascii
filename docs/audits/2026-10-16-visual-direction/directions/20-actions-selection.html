<style>

.as-q--back{--dx:-1;font-size:14px}
.as-q > .rule-soft{position:absolute;left:0;right:0;bottom:9px}
.dir-b .as-q > .rule-soft{height:2px;mask:var(--dither-3) 0 0 / var(--dither-size) var(--dither-size)}

.dir-b .as-q::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:2px;background:var(--as-row);clip-path:inset(0 100% 0 0)}
.dir-b .as-q--back::after{clip-path:inset(0 0 0 100%)}
.dir-a .as-q:is(:hover,:focus-visible):not([aria-disabled]) > .rule-soft{mask:none}
.as-q:is(:hover,:focus-visible):not([aria-disabled]) .as-ar{transform:translateX(calc(3px * var(--dx)))}
.dir-a .as-q:is(:hover,:focus-visible):not([aria-disabled]) .as-ar{animation:as-nudge-a 120ms steps(1,jump-end)}
.dir-b .as-q:is(:hover,:focus-visible):not([aria-disabled])::after,.dir-b details[open] > .as-q::after{clip-path:inset(0);transition:clip-path 140ms steps(7,jump-start)}
.dir-b .as-q:is(:hover,:focus-visible):not([aria-disabled]) .as-ar{animation:as-nudge-b 90ms steps(1,jump-end)}
.dir-c .as-q:is(:hover,:focus-visible):not([aria-disabled]) > .rule-soft{mask-image:none;animation:as-resolve 100ms steps(1,jump-end)}
.dir-c .as-q:is(:hover,:focus-visible):not([aria-disabled]) .as-ar{animation:as-nudge-c 200ms steps(1,jump-end)}
.dir-a .as-q.is-down > .rule-soft{height:3px;mask:none}
.dir-b .as-q.is-down::after{clip-path:inset(0);transition:none}
.dir-c .as-q.is-down > .rule-soft{mask-image:none;animation:none}
.dir-c .as-q.is-up > .rule-soft{mask-image:var(--dither-6);animation:none}
.as-q[aria-disabled]{color:var(--muted);cursor:not-allowed}
.as-q[aria-disabled] > .rule-soft{mask-image:var(--dither-2)}
@keyframes as-nudge-a{0%{transform:translateX(calc(2px * var(--dx)))}
50%,100%{transform:translateX(calc(3px * var(--dx)))}
}
@keyframes as-nudge-b{0%{transform:translateX(calc(2px * var(--dx)))}
33%{transform:translateX(calc(4px * var(--dx)))}
66%,100%{transform:translateX(calc(3px * var(--dx)))}
}
@keyframes as-nudge-c{0%{transform:translateX(calc(4px * var(--dx)))}
50%,100%{transform:translateX(calc(3px * var(--dx)))}
}
@keyframes as-resolve{0%{mask-image:var(--dither-6)}
50%,100%{mask-image:none}
}
</style>
<script>
/* Batch 2 helpers (declarations only). as2Down: the quiet press (A rule 3 px for 100 ms, B row solid 200 ms, C band solid 200 ms then back through 6). */
function as2Down(el, dir, api) {
if (!Dir.motionActive()) return;
el.classList.add("is-down");
api.timeout(() => {
el.classList.remove("is-down");
if (dir === "c") { el.classList.add("is-up"); api.timeout(() => el.classList.remove("is-up"), 60); }
}, dir === "a" ? 100 : 200);
}
/* as2Walk: step cells through frames of levels; a newer call wins mid-flight; only the last frame when motion is off. */
function as2Walk(owner, list, frames, ms) {
const id = (owner._as2 = (owner._as2 || 0) + 1);
const run = Dir.motionActive() ? frames : frames.slice(-1);
run.forEach((frame, i) => setTimeout(() => { if (owner._as2 === id) list.forEach((cell, j) => Dir.setLevel(cell, frame[j % frame.length])); }, i * ms));
return run.length * ms;
}
/* as2Show: a panel or list arriving. A and B are clipped open from the trigger edge (clip-path transition, steps
inside); C resolves through dither levels 2, 4, 6 by attribute swap. ms 0, keyboard or motion off: at once. */
function as2Show(el, dir, ms, steps) {
const id = (el._as2s = (el._as2s || 0) + 1);
el.style.transition = "none";
el.style.clipPath = "";
delete el.dataset.level;
if (!ms || !Dir.motionActive()) return;
if (dir === "c") {
[2, 4, 6, 0].forEach((lv, i) => setTimeout(() => { if (el._as2s !== id) return; if (lv) el.dataset.level = String(lv); else delete el.dataset.level; }, (i * ms) / 4));
return;
}
el.style.clipPath = "inset(0 0 100% 0)";
void el.offsetWidth;
el.style.transition = `clip-path ${ms}ms steps(${steps}, jump-start)`;
el.style.clipPath = "inset(0)";
}
</script>

const play = buttons[0];
const tip = play.parentNode.querySelector(".as-tip");
const surface = api.fill(play, { size: dir === "c" ? 12 : 8 });
const IN = { a: { order: "reading", levels: [2, 4, 6, 8], stepMs: 20, total: 80 }, b: { order: "diagonal", total: 52 }, c: { order: "bayer", levels: [2, 4, 6], stepMs: 50, total: 0, holdAt: 6, holdMs: 120 } }[dir];

play.setAttribute("aria-label", name);
tip.textContent = name;
api.morph(icons[0], on ? "pause" : "play");

});

/* Motion check: 1 click hands over; arrows, Home, End instant 2 in 160-240, out shorter; panel A 0, B 240, C 200 3 steps inside, B rule ease-in-out 4 panel clipped, not from zero 5 fill+clip retarget 6 levels, clip (no left/width) 7 off: selected still solid */
Dir.component("cmp-segmented", (col, dir, api) => {
const tabs = [...col.querySelectorAll("[role=tab]")];
const seg = col.querySelector(".as-seg");
const pos = col.querySelector(".as-seg-pos");
const bar = pos.firstElementChild;
const panel = col.querySelector("[role=tabpanel]");
const fills = tabs.map((t) => api.fill(t, { size: dir === "c" ? 12 : 8 }));
const IN = { a: { order: "reading", levels: [2, 4, 6, 8], stepMs: 20, total: 80 }, b: { order: "reading", total: 112 }, c: { order: "bayer", levels: [2, 4, 6], stepMs: 50, total: 0, holdAt: 6, holdMs: 120 } }[dir];
const OUT = { a: { levels: [0], stepMs: 1, total: 0 }, b: { order: "reading", total: 72 }, c: { order: "bayer", levels: [4, 0], stepMs: 120, total: 0 } }[dir];
const now = (lv) => ({ levels: [lv], stepMs: 1, total: 0 });
let cur = -1;
const place = (instant) => {
if (dir !== "b" || cur < 0) return;
const w = seg.offsetWidth;
const t = tabs[cur];
pos.style.width = `${w}px`;
bar.style.transition = instant ? "none" : "";
bar.style.clipPath = `inset(0 ${w - t.offsetLeft - t.offsetWidth}px 0 ${t.offsetLeft}px)`;
};
const select = (i, key) => {
if (key) tabs[i].focus();
if (i === cur) return;

tabs.forEach((t, k) => { t.setAttribute("aria-selected", String(k === i)); t.tabIndex = k === i ? 0 : -1; });
if (cur >= 0) fills[cur].to(0, instant ? now(0) : OUT);
fills[i].to(8, instant ? now(8) : IN);
as2Show(panel, dir, instant || dir === "a" ? 0 : dir === "b" ? 240 : 200, 10);
cur = i;
panel.textContent = tabs[i].dataset.text;
panel.setAttribute("aria-labelledby", tabs[i].id);
place(instant);
};
tabs.forEach((t, i) => t.addEventListener("click", () => select(i)));
seg.addEventListener("keydown", (e) => {
const n = tabs.length;
const next = { ArrowRight: cur + 1, ArrowDown: cur + 1, ArrowLeft: cur - 1, ArrowUp: cur - 1, Home: 0, End: n - 1 }[e.key];
if (next == null) return;
e.preventDefault();
select((next + n) % n, true);
});
select(0);
const ro = new ResizeObserver(() => place(true));
ro.observe(seg);
return () => ro.disconnect();
});
</script>

const btn = wrap.querySelector("button");
const list = wrap.querySelector("[role=listbox]");
const value = wrap.querySelector(".as-lb-v");
const opts = [...list.children];
const size = dir === "c" ? 12 : 8;
const lv = dir === "b" ? 8 : 6;
let sel = 3;
let act = 3;
const activate = (i) => {

};

btn.setAttribute("aria-expanded", "true");
paint();

if (focus) btn.focus();
};

opts.forEach((o, i) => {
o.addEventListener("pointerenter", () => activate(i));
o.addEventListener("click", () => choose(i));
});
btn.addEventListener("click", (e) => { if (e.detail === 0) return; if (list.hidden) open(true); else close(false); });

<script>
/* Motion check: 1 click, repeatable: value at once (B glyphs 60) 2 press under 300, out shorter 3 steps 4 scale .97 5 runtime fill 6 levels+transform 7 off: instant, ends still dotted */
Dir.component("cmp-stepper", (col, dir, api) => {
const [prev, next] = col.querySelectorAll(".as-ib");
const num = col.querySelector(".as-st-n");
const why = col.querySelector(".reason");
const list = api.cells(col.querySelector(".as-st-pos"), 12);
let at = 1;
const set = (v, animate) => {
at = v;
if (dir === "b" && animate && Dir.motionActive()) {
num.textContent = "░";
api.timeout(() => { num.textContent = "▓"; }, 30);
api.timeout(() => { num.textContent = String(at); }, 60);
} else num.textContent = String(at);
list.forEach((c, i) => api.setLevel(c, i < at ? 8 : 0));
[[prev, at === 1], [next, at === 12]].forEach(([b, end]) => {

if (end) b.setAttribute("aria-describedby", why.id); else b.removeAttribute("aria-describedby");
});

};

});

<style>
.as-dcs{justify-items:stretch}
.as-dc summary{list-style:none;width:max-content;max-width:100%}
.as-dc summary::-webkit-details-marker{display:none}
.as-dc .as-chev{margin-left:4px}
.dir-b .as-dc summary > .rule-soft,.dir-b .as-dc summary::after{height:3px}
.dir-c .as-dc[open] > summary > .rule-soft{mask-image:none}
.as-dc-p{max-width:52ch;padding:11px 0 22px;font-size:15px;line-height:1.55;color:var(--text-soft)}
.dir-a .as-dc-p{border-top:1px solid var(--line)}
.dir-c .as-dc-p{position:relative;padding-left:17px}
.dir-c .as-dc-p::before{content:"";position:absolute;left:0;top:0;bottom:11px;width:6px;background:var(--ink);mask:var(--dither-1) 0 0 / var(--dither-size) var(--dither-size)}
</style>
<script>
/* Motion check: 1 click opens on the switch; Enter or Space instant 2 open 200-240, close instant 3 steps(4), morph 120 4 clipped from the summary 5 clip+levels retarget 6 clip, level 7 off: instant, chevron and rule show state */
Dir.component("cmp-disclosure", (col, dir, api) => {
col.querySelectorAll("details").forEach((d) => {
const sum = d.querySelector("summary");
const chev = d.querySelector(".as-chev");
const panel = d.querySelector(".as-dc-p");
let pointer = false;
api.icon(chev, "chevron");
sum.addEventListener("click", (e) => { pointer = e.detail > 0; });
d.addEventListener("toggle", () => {
const name = d.open ? "chevronUp" : "chevron";
if (pointer) api.morph(chev, name); else api.icon(chev, name);
if (d.open) as2Show(panel, dir, pointer ? api.ms("--switch") : 0, 4);
pointer = false;
});
});
});
</script>
</article>
