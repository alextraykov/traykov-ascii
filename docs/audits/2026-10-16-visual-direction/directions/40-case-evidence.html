<script>
window.CE4={
play(el,cls="is-entering"){
if(!Dir.motionActive())return;
el.style.setProperty("--enter-delay","0ms");
el.classList.remove(cls);
void el.offsetWidth;
el.classList.add(cls);
const end=(e)=>{if(e.target===el){el.classList.remove(cls);el.removeEventListener("animationend",end);}};
el.addEventListener("animationend",end);
},
ph(scope,api){
scope.querySelectorAll("[data-ph]").forEach((el)=>{
api.placeholder(el,16,10,el.dataset.ph||"block");
if(el.dataset.tex)el.querySelector(".tex").dataset.level=el.dataset.tex;
});
},
ic(host,name,cell){
Object.assign(Dir.ICONS,{pair:[".#.#.","#...#",".#.#."],expand:["##.##","#...#",".....","#...#","##.##"]});
return Dir.icon(host,name,{cell});
},
chip(host,status,api){
const one={launched:8,"closed beta":5,prototype:3,archived:1},three={launched:[8,8,8],"closed beta":[8,5,0],prototype:[3,0,0],archived:[1,0,0]},key=status.toLowerCase(),levels=api.dir==="b"?three[key]||[-1]:[key in one?one[key]:-1],c=document.createElement("span");
c.className="chip-c";
c.setAttribute("aria-hidden","true");
levels.forEach((l)=>{const[cell]=api.cells(c,1,{level:Math.max(0,l),clear:l<0});if(l<0)cell.classList.add("is-dotted");});
host.classList.add("chip");
host.replaceChildren(c,status);
return c;
},
res(el,levels,ms=50,done){
(el._rv||[]).forEach(clearTimeout);
el._rv=[];
if(!levels.length||!Dir.motionActive()){delete el.dataset.level;if(done)done();return;}
levels.forEach((l,k)=>el._rv.push(setTimeout(()=>{el.dataset.level=l;},k*ms)));
el._rv.push(setTimeout(()=>{delete el.dataset.level;if(done)done();},levels.length*ms));
},
seg(group,onPick){
const bs=[...group.querySelectorAll("button")];
let cur=Math.max(0,bs.findIndex((b)=>b.getAttribute("aria-pressed")==="true"));
const pick=(i,kbd)=>{
if(i===cur)return;
cur=i;
bs.forEach((b,k)=>{b.setAttribute("aria-pressed",String(k===i));b.tabIndex=k===i?0:-1;});
if(kbd)bs[i].focus();
onPick(i,kbd);
};
bs.forEach((b,k)=>{b.tabIndex=k===cur?0:-1;b.addEventListener("click",(e)=>pick(k,e.detail===0));});
group.addEventListener("keydown",(e)=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();pick((cur+d+bs.length)%bs.length,true);}});
},
swap(stage,i,dir,kbd){
const ps=[...stage.children],cur=ps[i],still=kbd||!Dir.motionActive();
stage.classList.add("stk");
stage.classList.toggle("is-instant",still||dir==="a");
ps.forEach((p)=>{p.classList.toggle("is-prev",p!==cur&&p.classList.contains("is-cur"));p.classList.remove("is-cur");if(p!==cur)CE4.res(p,[]);});
void cur.offsetWidth;
cur.classList.add("is-cur");
if(dir==="c"&&!still)CE4.res(cur,[2,4,6],60);
clearTimeout(stage._t);
stage._t=setTimeout(()=>ps.forEach((p)=>p.classList.remove("is-prev")),still||dir==="a"?0:260);
}
};
</script>

<ol class="tl">
<li data-d="0"><div class="tl-e"><p class="tl-w"><time>25 Sep</time><span class="tl-rel">Start</span></p><p class="tl-t">Light mode audit</p><p class="tl-b">22 pages and 3 dialogs measured against Replit.</p></div></li>
<li data-d="4"><div class="tl-e"><p class="tl-w"><time>29 Sep</time><span class="tl-rel">4 days later</span></p><p class="tl-t">24 grid variants, then 10, then 6</p><p class="tl-b">The product lead picks the blueprint.</p></div></li>
<li data-d="7"><div class="tl-e"><p class="tl-w"><time>2 Oct</time><span class="tl-rel">3 days later</span></p><p class="tl-t">Light mode handoff</p><p class="tl-b">Plus 29 sign-in, account and error states.</p></div></li>
<li data-d="13"><div class="tl-e"><p class="tl-w"><time>8 Oct</time><span class="tl-rel">6 days later</span></p><p class="tl-t">Light surfaces in testing</p><p class="tl-b">One release covering 135 files.</p></div></li>
<li data-d="20"><div class="tl-e"><p class="tl-w"><time>15 Oct</time><span class="tl-rel">7 days later</span></p><p class="tl-t">Live for every Pave user</p><p class="tl-b">The blueprint home, sign-in, account pages and light mode, together.</p></div></li>
</ol>
<label class="tl-s"><span class="demo-label">Reading position, drag to reach the events</span><input type="range" min="0" max="20" value="9"></label>
</template>
<style>
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:16px}
.tl-r{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:6px}
.dir-c .tl-r{gap:2px}
.tl-r::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--line)}
.dir-b .tl-r::before{background:var(--ink);mask:var(--dither-3) 0 0 / var(--dither-size) var(--dither-size)}
.dir-c .tl-r::before{content:none}
.tl-m{position:relative;width:12px;height:12px}
.dir-a .tl-m{width:4px}
.tl-days{position:relative;display:flex;flex-direction:column;gap:inherit}
.tl-e{display:grid;gap:4px;padding-bottom:22px;transition:opacity 120ms steps(1,jump-start)}
.dir-b .tl-e{transition:opacity 160ms steps(3,jump-start)}
.ce .is-wait .tl-e{opacity:0;transition:none}
.tl-w{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;font:500 13px/1.4 var(--sans);color:var(--muted)}
.ce :is(.dir-b,.dir-c) time{font:400 var(--type-px-22)/1.1 var(--font-pixel);color:var(--ink)}
.tl-rel{display:none;font:400 var(--type-px-11)/1 var(--font-pixel)}
.dir-b .tl-rel{display:inline}
.tl-t{font:500 var(--read-size)/1.35 var(--sans)}
.tl-b{color:var(--text-soft)}
.tl-s{display:grid;gap:4px;margin-top:11px}
.tl-s input{width:100%;min-height:44px;margin:0;accent-color:var(--ink)}
</style>
<script>
/* Motion check · 1 scrub-driven (frequent): reveals short and cancellable, back hides at once. 2 A 1 step, B 160 ms, C 150 ms; day cells 30 ms apart. 3 steps only. 4 no scale. 5 transitions and cancellable levels. 6 opacity, mask. 7 off: all shown, marks solid, blink rests solid. */
Dir.component("cmp-timeline",(col,dir,api)=>{
const items=[...col.querySelectorAll(".tl > li")],range=col.querySelector(".tl-s input"),ds=items.map((li)=>+li.dataset.d);
items.forEach((li)=>li.insertAdjacentHTML("afterbegin",'<span class="tl-r" aria-hidden="true"><i class="cell tl-m"></i><span class="tl-days"></span></span>'));
const marks=items.map((li)=>li.querySelector(".tl-m")),off=dir==="c"?1:0,days=items.map((li,i)=>(dir==="a"||i===items.length-1?[]:api.cells(li.querySelector(".tl-days"),ds[i+1]-ds[i],{level:off})));
let pos=+range.value;let cur=-1;
const update=()=>{
const v=+range.value,still=!Dir.motionActive(),ahead=v>pos;
let queue=0;
pos=v;
range.setAttribute("aria-valuetext",`Day ${v} of 20`);
days.forEach((list,i)=>list.forEach((c,j)=>{
const day=ds[i]+j+1;
if(day<=v&&+c.dataset.level===off&&dir==="b"&&ahead&&!still){queue+=1;api.timeout(()=>{if(+range.value>=day)api.setLevel(c,3);},30*queue);}
else api.setLevel(c,day<=v?3:off);
}));
cur=-1;
items.forEach((li,i)=>{
if(ds[i]<=v)cur=i;
const reached=still||ds[i]<=v,entry=li.querySelector(".tl-e");
if(reached&&li.classList.contains("is-wait")&&dir==="c")CE4.res(entry,[2,4,6],50);
if(!reached)CE4.res(entry,[]);
li.classList.toggle("is-wait",!reached);
api.setLevel(marks[i],reached?8:3);
li.removeAttribute("aria-current");
});
if(cur>=0)items[cur].setAttribute("aria-current","step");
};
range.addEventListener("input",update);
api.cleanup(Dir.onMotion(update));
update();
api.tick(col.querySelector(".tl"),(t)=>{
if(cur<0||dir==="a")return;
api.setLevel(marks[cur],dir==="b"?(Math.floor(t/10)%2?3:8):t%10<2?6:8);
},()=>{if(cur>=0)api.setLevel(marks[cur],8);});
});
</script>
</article>

<article class="cmp" id="cmp-cover" data-name="Case cover entrance" data-group="Case pages" data-num="42"
data-baseline="Featured images arrive through a paper cover dissolving in diagonal order, 480 ms in 16 px cells, once per visit.">
<template data-markup>
<figure class="cv"><div class="cv-m" data-ph data-enter="media"></div><span class="cv-r"></span></figure>
<p class="reason cv-note"></p>
<button class="demo-link" type="button" data-play>Play the entrance</button>
</template>
<style>
.cv-note{margin-top:11px}
.cv-r{display:none;gap:1px;margin-top:8px}
.dir-b .cv-r{display:flex}
.cv-r .cell{flex:1;width:auto;height:3px}
</style>
<script>
/* Motion check · 1 once per visit or on request (rare, big). 2 A 300, B 360 + 140 ms rule, C 480 ms. 3 steps in, reading order across. 4 no scale; size fixed from frame one. 5 one-shot keyframes. 6 clip-path, mask. 7 off: image and rule at once. */
Dir.component("cmp-cover",(col,dir,api)=>{
CE4.ph(col,api);
const media=col.querySelector(".cv-m");
col.querySelector(".cv-note").textContent={
a:"Six bands in 300 ms, then still. No dissolve: A has one gesture.",
b:"Ten bands in 360 ms, then the rule under the image fills in reading order as a settled mark.",
c:"The paper cover dissolves away in 480 ms through 16 px cells (12 px in dark)."
}[dir];
col.querySelector("[data-play]").addEventListener("click",()=>api.enter(col.querySelector(".cv")));
if(dir!=="b")return;
const rule=col.querySelector(".cv-r"),cells=api.cells(rule,Math.max(8,Math.floor(rule.clientWidth/5)),{level:8}),settle=()=>Dir.runField({
values:cells.map((_,i)=>i/(cells.length-1)),total:120,curve:Dir.curves.linear,steps:1,stepMs:20,
render:(at)=>cells.forEach((c,i)=>{if(at(i)>=0)api.setLevel(c,8);})
});
media.addEventListener("animationstart",()=>cells.forEach((c)=>api.setLevel(c,0)));
media.addEventListener("animationend",settle);
media.addEventListener("animationcancel",()=>cells.forEach((c)=>api.setLevel(c,8)));
});
</script>
</article>
</section>
