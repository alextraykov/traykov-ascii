<style>
.t6-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border:1px solid var(--ink);background:var(--paper);font:500 13px/1 var(--sans);cursor:pointer}

#cmp-tool-panel{
.tp-wrap{display:grid;gap:22px}
@container col (min-width:641px){.tp-wrap{grid-template-columns:minmax(0,1fr) 320px;align-items:start}}
.tp-panel{position:relative;display:grid;gap:22px;background:var(--paper)}

.dir-c .tp-frame::before{content:"";position:absolute;inset:0;background:var(--ink);mask:var(--dither-1) 0 0/var(--dither-size) var(--dither-size)}

.tp-g{display:grid;gap:11px}

.dir-a .tp-n,.dir-c .tp-n,.dir-a .tp-hr,.dir-b .tp-sep,.dir-c .tp-sep{display:none}
.dir-b .tp-hr{height:2px}
.tp-f{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 11px}
.tp-f>.tp-range,.tp-f>.tp-sel{grid-column:1/-1}

.tp-range:has(:focus-visible),.tp-sel:has(:focus-visible){outline:2px solid var(--ink);outline-offset:2px}

<script>
/* Motion craft: 1 drags and arrow keys move the thumb 1:1, no transition; keyboard picks are one frame; clicks keep the handoff. 2 marker 120, in up to 240, outs shorter. 3 steps inside, reading or Bayer across. 4 scale(0.97) on tool buttons. 5 fills retarget, checkbox continues from its level. 6 transform and level swaps. 7 reduced: solid and check at once. */
Dir.component("cmp-tool-panel",(col,dir,api)=>{
const $=(s)=>col.querySelector(s),$$=(s)=>[...col.querySelectorAll(s)];
api.placeholder($("[data-stage]"),16,10);
const out=$(".tp-out"),select=$("select"),check=$("[data-check]");
let look="Vortex";
const write=()=>{
out.value=$$(".tp-range input").map((i)=>`${i.dataset.name}: ${i.value}`).join("\n")+`\nLook: ${look}\nGrain: ${select.value}\nInvert: ${check.checked ? "On" : "Off"}`;
};
$$(".tp-range").forEach((range)=>{
const input=range.querySelector("input"),track=range.querySelector(".tp-track"),value=range.parentNode.querySelector("output");
let list=[];
if(dir==="a")track.innerHTML='<i class="tp-fa"></i><i class="tp-th"></i>';
else{list=api.cells(track,dir==="b"?24:12);if(dir==="c")track.insertAdjacentHTML("beforeend",'<i class="tp-line"></i>');}
let hot=false;
const draw=()=>{
const f=(input.value-input.min)/(input.max-input.min);
track.querySelectorAll(".tp-fa,.tp-th,.tp-line").forEach((i)=>i.style.setProperty("--f",f));
value.textContent=input.value;
const x=f*list.length,full=Math.floor(x),frac=x-full;
list.forEach((cell,i)=>{
let level=i<full?8:0;
if(i===full&&frac>0)level=dir==="b"?Math.max(1,Math.round(frac*8)):2+Math.round(frac*5);
if(dir==="b"&&hot&&i===Math.min(full,list.length-1)&&level<8)level+=1;
api.setLevel(cell,level);
});
};
input.addEventListener("input",()=>{draw();write();});
range.addEventListener("pointerenter",()=>{hot=true;draw();});
range.addEventListener("pointerleave",()=>{hot=false;draw();});
draw();
});
const looks=$$("[data-look]");
const sel={
a:[{order:"reading",levels:[2,4,6,8],stepMs:40,total:0},{levels:[0],stepMs:1,total:0},8],
b:[{order:"reading",total:112,stepMs:16},{order:"reading",total:72,stepMs:16},8],
c:[{order:"bayer",levels:[2,4,6],stepMs:80,total:0},{order:"bayer",levels:[3,0],stepMs:80,total:0},6]
}[dir];
const now={levels:[0],stepMs:1,total:0};
let kb=false;
col.addEventListener("keydown",()=>{kb=true;},true);
col.addEventListener("pointerdown",()=>{kb=false;},true);
looks.forEach((button)=>{
const f=api.fill(button,{size:dir==="c"?12:6});
if(button.getAttribute("aria-pressed")==="true")f.to(sel[2],{levels:[sel[2]],stepMs:1,total:0});
button.addEventListener("click",(e)=>{
if(button.getAttribute("aria-pressed")==="true")return;
const kb=e.detail===0;
looks.forEach((other)=>{if(other.getAttribute("aria-pressed")==="true"){other.setAttribute("aria-pressed","false");api.fill(other).to(0,kb?now:sel[1]);}});
button.setAttribute("aria-pressed","true");
f.to(sel[2],kb?{levels:[sel[2]],stepMs:1,total:0}:sel[0]);
look=button.textContent.trim();
write();
});
});
api.icon($(".tp-chev"),"chevron",{cell:3});
const rule=$(".tp-selrule");
select.addEventListener("focus",()=>rule.classList.add("is-on"));
select.addEventListener("blur",()=>rule.classList.remove("is-on"));
select.addEventListener("change",write);
const box=$(".tp-box"),dot=$(".tp-dot"),onoff=$(".tp-onoff");
api.icon($(".tp-tick"),"check",{cell:dir==="c"?3:2});
const path={a:[[3,6,8],[6,3,0],40],b:[[4,8],[4,0],30],c:[[2,4,6,8],[6,4,2,0],50]}[dir];
let stop=()=>{};
check.addEventListener("change",()=>{
const on=check.checked,cur=Number(dot.dataset.level);
let steps=path[on?0:1].filter((l)=>(on?l>cur:l<cur));
if(kb||!steps.length)steps=[on?8:0];
stop();
box.classList.remove("is-on");
onoff.textContent=on?"On":"Off";
stop=Dir.runField({values:[0],total:0,steps:steps.length,stepMs:path[2],render:(at)=>{const k=at(0);if(k>=0)dot.dataset.level=steps[Math.min(k,steps.length-1)];},done:()=>box.classList.toggle("is-on",on)});
write();
});
write();
});
</script>
</article>

<article class="cmp" id="cmp-tool-primary" data-name="Tool primary and export with progress" data-group="Labs tool panels" data-num="52"
data-baseline="Save PNG is a 40 px solid ink primary; the studio exports are buttons that open in one tab, with no progress shown.">
<template data-markup>
<div class="ex">
<div class="demo-row">
<button class="t6-btn t6-big t6-pri" type="button" data-press="primary" data-marker="left" data-save><span data-label-step>Save PNG</span></button>
<button class="t6-btn t6-big" type="button" data-marker="left" data-export><span class="fill-label" data-label-step><span class="ex-slot" data-slot>Export SVG</span></span></button>
</div>
<p class="reason" id="ex-why" hidden>The export stopped because the picture is too large. Try a smaller size.</p>
<p class="reason" data-how></p>
<p class="vh" aria-live="polite" data-live></p>
<div class="demo-row">
<button class="demo-link" type="button" data-sim-save>Simulate save</button>
<button class="demo-link" type="button" data-sim-export>Simulate export</button>
<button class="demo-link" type="button" data-err>Show error</button>
</div>
</div>
</template>
<style>
#cmp-tool-primary{
.ex{display:grid;gap:11px}
.ex-slot{display:inline-flex;align-items:center;gap:8px}
.ex-slot .px{font:400 var(--type-px-11)/1 var(--font-pixel)}
.ex-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:1px;height:4px;z-index:1}
.ex-bar .cell{flex:1 1 0;width:auto;height:100%}
@container col (max-width:640px){.t6-big{flex:1 1 100%}}

}
</style>
<script>
/* Motion craft: 1 occasional click; progress is system time. 2 press per direction; C fill out 120 against 150 in; Saved holds 1.5 s. 3 steps inside, order across. 4 scale(0.97). 5 fill retargets; clicks while working are ignored. 6 transform and level swaps. 7 reduced: words, figures and check still show; the quarter turn rests on head and tail. */
Dir.component("cmp-tool-primary",(col,dir,api)=>{
const $=(s)=>col.querySelector(s);
const save=$("[data-save]"),btn=$("[data-export]"),slot=$("[data-slot]"),why=$("#ex-why-"+dir),live=$("[data-live]");
$("[data-how]").textContent={
a:"Export works with a quarter turn and one cell whose level is the real progress, then Saved with the check.",
b:"Export fills a 12-cell bar along the bottom edge and counts the percentage, then Saved.",
c:"Export holds the fill at level 5, raises it to 6, 7 and 8 by thirds, then Saved with the check."
}[dir];
$("[data-sim-save]").addEventListener("click",()=>api.simulate(save,{working:"Saving",done:"Saved"}));
const word=(t)=>{const s=document.createElement("span");s.textContent=t;return s;};
const f=dir==="c"?api.fill(btn,{size:12}):api.press(btn,{role:"secondary"}).fill;
let timer=0;
api.cleanup(()=>clearTimeout(timer));
const run=()=>{
if(btn.dataset.state)return;
why.hidden=true;
btn.classList.remove("is-error");
btn.removeAttribute("aria-describedby");
btn.dataset.state="working";
btn.setAttribute("aria-busy","true");
live.textContent="Exporting";
let stopQ=()=>{},cell,bar,pct;
slot.replaceChildren();
if(dir==="a"){
const q=document.createElement("span");stopQ=api.loader(q,"quarter");
cell=api.cells(document.createElement("span"),1)[0];
slot.append(q,word("Exporting"),cell);
}else if(dir==="b"){
pct=document.createElement("span");pct.className="px";pct.textContent="0%";
slot.append(word("Exporting ·"),pct);
bar=document.createElement("span");bar.className="ex-bar";bar.setAttribute("aria-hidden","true");
btn.append(bar);bar=api.cells(bar,12);
}else{
btn._invertAt=5;
f.to(5,{order:"bayer",levels:[2,4,5],stepMs:50,total:0});
slot.append(word("Exporting"));
}
let step=0;
const tick=()=>{
step+=1;
const p=step/10;
if(cell)api.setLevel(cell,p*8);
if(bar){const x=p*12;bar.forEach((c,i)=>api.setLevel(c,i<Math.floor(x)?8:i===Math.floor(x)?(x%1)*8:0));pct.textContent=`${Math.round(p * 100)}%`;}
if(dir==="c"){const level=p>=1?8:p>=2/3?7:p>=1/3?6:5;if(level!==btn._lvl){btn._lvl=level;f.to(level,{order:"bayer",levels:[level],stepMs:1,total:0});}}
if(step<10){timer=setTimeout(tick,150);return;}
timer=setTimeout(()=>{
stopQ();
if(bar)bar[0].parentNode.remove();
btn._lvl=0;
if(dir==="c"){btn._invertAt=6;f.to(0,{order:"bayer",levels:[3,0],stepMs:60,total:0});}
const ok=document.createElement("span");ok.className="cell-icon--ok";api.icon(ok,"check");
slot.replaceChildren(ok,word("Saved"));
btn.dataset.state="done";
btn.removeAttribute("aria-busy");
live.textContent="Saved";
api.marker(btn,"left").hold(true);
timer=setTimeout(()=>{slot.replaceChildren(word("Export SVG"));delete btn.dataset.state;api.marker(btn,"left").hold(false);},1500);
},200);
};
timer=setTimeout(tick,150);
};
btn.addEventListener("click",run);
$("[data-sim-export]").addEventListener("click",()=>btn.click());
$("[data-err]").addEventListener("click",()=>{
if(btn.dataset.state)return;
why.hidden=false;
btn.setAttribute("aria-describedby",why.id);
live.textContent=why.textContent;
api.flash(btn);
});
});
</script>
</article>

<article class="cmp" id="cmp-drop-zone" data-name="Drop zone" data-group="Labs tool panels" data-num="53"

<template data-markup>
<div class="dz" data-dz>
<span class="tex dz-tex" data-level="1" aria-hidden="true"></span>
<span class="dz-c" aria-hidden="true"></span><span class="dz-c" aria-hidden="true"></span><span class="dz-c" aria-hidden="true"></span><span class="dz-c" aria-hidden="true"></span>
<div class="dz-in" data-empty>
<span class="dz-icon"></span>
<p class="dz-t">Drop an SVG here</p>
<label class="dz-pick">or choose a file<input class="vh" type="file" accept=".svg,image/svg+xml" aria-describedby="dz-hint" data-file></label>

<div class="demo-row">

<button class="demo-link" type="button" data-load>Simulate a dropped file</button>
<button class="demo-link" type="button" data-err>Show error</button>
<button class="demo-link" type="button" data-reset>Start over</button>

</template>
<style>
#cmp-drop-zone{
.dz{position:relative;display:grid;place-items:center;min-height:176px;padding:16px;border:1px solid var(--line);text-align:center}
.dir-b .dz{border-color:var(--ink)}
.dir-c .dz{border:2px solid var(--ink)}
.dir-a .dz.is-over{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dz-tex{position:absolute;inset:0}
.dir-a .dz-tex,.dir-b .dz-tex{display:none}
.dz-c{position:absolute;display:grid;grid-template-columns:repeat(2,7px);gap:1px}
.dz-c .cell{width:7px;height:7px}
.dz-c:nth-of-type(2){left:3px;top:3px} .dz-c:nth-of-type(3){right:3px;top:3px}
.dz-c:nth-of-type(4){left:3px;bottom:6px} .dz-c:nth-of-type(5){right:3px;bottom:6px}
.dir-a .dz-c,.dir-c .dz-c{display:none}
.dz-in{position:relative;display:grid;justify-items:center;gap:6px}
.dir-c .dz-in{padding:11px 16px;background:var(--paper)}
.dz-t{font:500 15px/1.3 var(--sans)}
.dz-pick{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font:500 15px/1 var(--sans);text-decoration:underline dotted 2px;text-underline-offset:4px;cursor:pointer}
.dir-c .dz-pick{text-decoration-thickness:3px}
.dz-pick:hover{text-decoration-style:solid}
.dz-pick:has(:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.dz-hint{font:400 13px/1.4 var(--sans);color:var(--muted)}
.dir-b .dz-hint,.dir-c .dz-hint{font:400 var(--type-px-11)/1.4 var(--font-pixel)}
.dz-name{display:inline-flex;align-items:center;gap:10px;font:500 15px/1.3 var(--sans)}
.dir-b .dz-name{font:400 var(--type-px-11)/1 var(--font-pixel)}
.dz-meter{display:inline-flex;align-items:center;gap:8px;font:400 var(--type-px-11)/1 var(--font-pixel);color:var(--muted)}
.dir-a .dz-meter,.dir-c .dz-meter{display:none}
[data-meter]{--cells:12;--cell-size:7px;--cell-gap:1px}
.dz-why{margin-top:8px}

}
</style>
<script>
/* Motion craft: 1 drag-over repeats, so in at most 120 and out in one step. 2 corners 120, texture 100 in, one step out, loaded afterglow 180. 3 corners in reading order. 4 no press, nothing from zero. 5 each change cancels the running field. 6 level and class swaps. 7 reduced: states swap at once. */
Dir.component("cmp-drop-zone",(col,dir,api)=>{
const $=(s)=>col.querySelector(s);
const zone=$("[data-dz]"),tex=$(".dz-tex"),empty=$("[data-empty]"),done=$("[data-done]"),why=$("[data-why]"),live=$("[data-live]"),overBtn=$("[data-over]");
api.icon($(".dz-icon"),"upload",{cell:{a:3,b:7,c:5}[dir]});
api.icon($("[data-ok]"),"check");
const corners=[...col.querySelectorAll(".dz-c")].map((c)=>api.cells(c,4,{clear:true}));
const meter=api.cells($("[data-meter]"),12);
const under=dir==="b"?api.marker(zone,"under"):null;
const left=dir==="a"?api.marker(zone,"left"):null;
let over=false,stop=()=>{};
const setOver=(on)=>{
if(on===over)return;
over=on;
overBtn.setAttribute("aria-pressed",String(on));
zone.classList.toggle("is-over",on);
stop();
if(dir==="b"){
if(on){under.arrive();stop=Dir.runField({values:[0,1/3,2/3,1],total:90,curve:Dir.curves.linear,steps:1,stepMs:30,render:(at)=>corners.forEach((list,i)=>{if(at(i)>=1)list.forEach((c)=>api.setLevel(c,8));})});}
else{under.leave();corners.forEach((list)=>list.forEach((c)=>api.setLevel(c,0)));}
}
if(dir==="c"){const path=on?[2,3]:[1];stop=Dir.runField({values:[0],total:0,steps:path.length,stepMs:50,render:(at)=>{const k=at(0);if(k>=0)tex.dataset.level=path[Math.min(k,path.length-1)];}});}
};
const load=(name)=>{
setOver(false);
if(!/\.svg$/i.test(name)){showError();return;}
why.hidden=true;
zone.classList.remove("is-error");
empty.hidden=true;
done.hidden=false;
$("[data-name]").textContent=name;
live.textContent=`Loaded ${name}`;
if(left)left.hold(true);
if(dir==="c")api.leave(tex);
if(dir==="b"){
$("[data-read]").textContent="Reading";
meter.forEach((c)=>api.setLevel(c,0));
stop=Dir.runField({values:meter.map((_,i)=>i/11),total:330,curve:Dir.curves.linear,steps:2,stepMs:30,render:(at)=>meter.forEach((c,i)=>{const k=at(i);if(k>=0)api.setLevel(c,k?8:5);}),done:()=>{$("[data-read]").textContent="Read";}});
}
};
const showError=()=>{why.hidden=false;live.textContent=why.textContent;api.flash(zone);};
const reset=()=>{
setOver(false);stop();
empty.hidden=false;done.hidden=true;why.hidden=true;
zone.classList.remove("is-error");
tex.hidden=false;tex.dataset.level="1";
if(left)left.hold(false);
live.textContent="";
};
zone.addEventListener("dragenter",(e)=>{e.preventDefault();setOver(true);});
zone.addEventListener("dragover",(e)=>e.preventDefault());
zone.addEventListener("dragleave",(e)=>{if(!zone.contains(e.relatedTarget))setOver(false);});
zone.addEventListener("drop",(e)=>{e.preventDefault();const file=e.dataTransfer&&e.dataTransfer.files[0];if(file)load(file.name);else setOver(false);});
$("[data-file]").addEventListener("change",(e)=>{const file=e.target.files[0];if(file)load(file.name);});
overBtn.addEventListener("click",()=>setOver(!over));
$("[data-load]").addEventListener("click",()=>{reset();load("studio-mark.svg");});
$("[data-err]").addEventListener("click",()=>{reset();showError();});
$("[data-reset]").addEventListener("click",reset);
});
</script>

/* Motion craft: 1 arrow keys instant; clicks keep the cell handoff; hover one step in, instant out. 2 in 60 to 240, out 30 to 160. 3 steps inside one cell. 4 chips never scale. 5 continues from the current level. 6 level swaps. 7 reduced: chosen cell solid at once. */

const items=[...col.querySelectorAll(".sw-i")],now=col.querySelector("[data-now]");
const marks=items.map((item)=>item.querySelector(".sw-mk"));
if(dir!=="a")marks.forEach((m)=>{m.classList.add("cell");});

stops.set(mark,Dir.runField({values:[0],total:0,steps:path.length,stepMs:dir==="c"?80:30,render:(at)=>{const k=at(0);if(k>=0)api.setLevel(mark,path[Math.min(k,path.length-1)]);}}));

<script>

<article class="cmp" id="cmp-point-refresh" data-name="Point refresh on hover" data-group="Page" data-num="58"
data-baseline="Hovering a work entry's media or a Labs screen covers it in 12 px paper cells through levels 5, 3 and 1, outward from the pointer over 360 ms; fine pointers only.">
<template data-markup>
<div class="prf">
<div class="prf-m" data-media></div>
<span class="prf-rule" aria-hidden="true"></span>
<p class="reason" data-note></p>
<div class="demo-row"><button class="demo-link" type="button" data-play>Play from the centre</button></div>
</div>
</template>
<style>
#cmp-point-refresh{
.prf{display:grid;gap:11px}
.prf-m canvas{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none}
.prf-rule{display:flex;gap:1px;height:4px;margin-top:-7px;overflow:hidden}
.prf-rule .cell{width:4px;height:4px}
.dir-a .prf-rule,.dir-c .prf-rule{display:none}

}
</style>
<script>
/* Motion craft: 1 on entering the picture only, at most once per 600 ms, fine pointers only. 2 240 to 480, decorative. 3 ease-out of distance across, steps inside. 4 no press. 5 a new run waits; motion off removes it. 6 a canvas that never catches the pointer. 7 reduced: nothing plays. */
Dir.component("cmp-point-refresh",(col,dir,api)=>{
const media=col.querySelector("[data-media]"),ruleHost=col.querySelector(".prf-rule");
api.placeholder(media,16,10);
const fine=matchMedia("(hover: hover) and (pointer: fine)");
const P={a:{cell:12,pitch:12,levels:[3,1],spread:160},b:{cell:7,pitch:8,levels:[5,3,1],spread:360},c:{cell:16,pitch:16,levels:[6,4,2],spread:360}}[dir];
const B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
col.querySelector("[data-note]").textContent=(fine.matches?"Hover the picture. ":"This plays on hover with a mouse or trackpad; on touch nothing plays. ")+{
a:"12 px cells, levels 3 then 1, 240 ms in all.",
b:"8 px cells, levels 5, 3, 1 over 360 ms, and the rule below fills outward from the pointer.",
c:"16 px cells, levels 6, 4, 2 over 360 ms, printed at the 12 px tile."
}[dir];
let rule=[];
if(dir==="b")rule=api.cells(ruleHost,Math.floor(media.clientWidth/5)||60);
let busy=false,last=0;
const run=(px,py)=>{
if(busy||performance.now()-last<600||!Dir.motionActive())return;
last=performance.now();
const rect=media.getBoundingClientRect();
if(rect.width<40)return;
busy=true;
const canvas=document.createElement("canvas");
canvas.setAttribute("aria-hidden","true");
canvas.width=Math.ceil(rect.width);canvas.height=Math.ceil(rect.height);
media.append(canvas);
const ctx=canvas.getContext("2d"),paper=getComputedStyle(col).getPropertyValue("--paper").trim();
const dot=dir==="c"?Math.max(1,parseFloat(getComputedStyle(col).getPropertyValue("--dither-size"))/4):1;
const fills={};
P.levels.forEach((level)=>{
const tile=document.createElement("canvas");tile.width=tile.height=dot*4;
const t=tile.getContext("2d");t.fillStyle=paper;
B.forEach((th,i)=>{if(th<level*2)t.fillRect((i%4)*dot,Math.floor(i/4)*dot,dot,dot);});
fills[level]=ctx.createPattern(tile,"repeat");
});
const cols=Math.ceil(rect.width/P.pitch),rows=Math.ceil(rect.height/P.pitch);
const gx=(px-rect.left)/P.pitch,gy=(py-rect.top)/P.pitch;
const far=Math.hypot(Math.max(gx,cols-gx),Math.max(gy,rows-gy))||1;
const delays=[];
for(let y=0;y<rows;y+=1)for(let x=0;x<cols;x+=1)delays.push(P.spread*Dir.curves.out(Math.hypot(x+0.5-gx,y+0.5-gy)/far));
if(rule.length){
const ox=((px-rect.left)/rect.width)*rule.length,span=Math.max(ox,rule.length-ox)||1;
Dir.runField({values:rule.map((_,i)=>Math.abs(i-ox)/span),total:100,curve:Dir.curves.linear,steps:1,stepMs:40,render:(at)=>rule.forEach((c,i)=>{if(at(i)>=1)api.setLevel(c,8);})});
}
const end=P.spread+P.levels.length*40,t0=performance.now();
const frame=(now)=>{
const el=now-t0;
if(!Dir.motionActive()||!canvas.isConnected){canvas.remove();rule.forEach((c)=>api.setLevel(c,0));busy=false;return;}
ctx.clearRect(0,0,canvas.width,canvas.height);
delays.forEach((d,i)=>{
const k=Math.floor((el-d)/40);
if(k<0||k>=P.levels.length)return;
ctx.fillStyle=fills[P.levels[k]];
ctx.fillRect((i%cols)*P.pitch,Math.floor(i/cols)*P.pitch,P.cell,P.cell);
});
if(el<end){requestAnimationFrame(frame);return;}
canvas.remove();
rule.forEach((c)=>api.setLevel(c,0));
api.timeout(()=>{busy=false;},300);
};
requestAnimationFrame(frame);
};
media.addEventListener("pointerover",(e)=>{if(fine.matches&&!(e.relatedTarget&&media.contains(e.relatedTarget)))run(e.clientX,e.clientY);});
col.querySelector("[data-play]").addEventListener("click",()=>{const r=media.getBoundingClientRect();run(r.left+r.width/2,r.top+r.height/2);});
});
</script>
</article>
