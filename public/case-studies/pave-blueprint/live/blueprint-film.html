<html lang="en">
<head>

<title>Blueprint film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* the film: the drafting sheet and its blocks, full-bleed, nothing else on the page */

  body[data-theme="dark"] { --page:#111715; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--page); }
  #field { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  /* the engine needs a composer and a prompt to measure; here they are a hairline the sheet's middle band forms around, never seen */
  #composer { position:fixed; left:50%; top:calc(50% - 70px); width:1px; height:140px; visibility:hidden; pointer-events:none; }
  #prompt { display:none; }
  #panel { display:none; }
  /* the safe frame: no block opens within these strips, so every one arrives whole inside the picture */
  .safe { position:fixed; left:0; right:0; height:5vh; visibility:hidden; pointer-events:none; } .safe.top { top:0; } .safe.bot { bottom:0; }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div class="safe top" aria-hidden="true"></div><div class="safe bot" aria-hidden="true"></div>
<form id="composer" aria-hidden="true"><textarea id="prompt" tabindex="-1"></textarea></form>

</aside>

        ctx.fillStyle = green(0.08 * k); ctx.fillRect(ox + bx, oy + by, bw, bh);
        ctx.strokeStyle = green(0.35 * k); ctx.lineWidth = hair; ctx.beginPath();
        const span = bw + bh, gapH = 6 * hair; for (let q = -bh; q < span; q += gapH) { ctx.moveTo(ox + bx + q, oy + by + bh); ctx.lineTo(ox + bx + q + bh, oy + by); }
        ctx.stroke(); ctx.restore();
        ctx.strokeStyle = green(0.6 * k); ctx.setLineDash([3 * hair, 2 * hair]); ctx.strokeRect(ox + bx, oy + by, bw, bh); ctx.setLineDash([]);
      }
      ctx.strokeStyle = ink(0.7 * k); ctx.lineWidth = hair; ctx.strokeRect(ox + o.x, oy + o.y, o.w, o.h);
    }
    /* every stroke, traced in build order at its drawing weight: the outline is the heaviest line, rules lighter, lettering grey */
    if (sk.trace > 0) {
      const n = bp.parts.length;
      ctx.save(); ctx.translate(ox, oy);
      bp.parts.forEach((q, i) => {
        const k = EASE.io(clamp01(sk.trace * 1.6 - (i / Math.max(1, n - 1)) * 0.6)); if (k <= 0) return;
        ctx.strokeStyle = q.role === 'text' ? ink(0.45) : ink(0.85); ctx.lineWidth = TRACE_W[q.role] * hair;
        strokePart(ctx, q, 0, q.len * k);
      });
      ctx.restore();
    }
    /* names: the construct and its size in lattice units, the lattice, the kept margins, and the drawing weights */
    if (sk.labels > 0) {
      const ks = [0, 1, 2, 3].map((n) => EASE.out(clamp01(sk.labels * 2 - n * 0.25)));
      const kind = bp.kind[0].toUpperCase() + bp.kind.slice(1);
      if (ks[0] > 0) tag(`${kind} · ${Math.round(o.w / lat.sx)} × ${Math.round(o.h / lat.sy)} units`, ox + o.x + 6 * hair, oy + o.y + 6 * hair, ks[0]);
      if (ks[1] > 0) { const t = `${lat.nx} × ${lat.ny} lattice · ${lat.sx.toFixed(1)} px pitch`; tag(t, r.x + r.w - tagW(t) - 8 * hair, r.y + r.h - tagH - 8 * hair, ks[1]); }
      if (ks[2] > 0) tag('kept for dimensions', ox + o.x + o.w + 4 * hair, oy + o.y + o.h + 4 * hair, ks[2], green);
      if (ks[3] > 0) { const t = 'outline 1.4 · rules 0.7 · lettering 1.1 · hatch 0.6'; tag(t, r.x + 8 * hair, r.y + r.h - tagH - 8 * hair, ks[3]); }
    }
    /* the cards: an outline each */
    if (sk.cards > 0) {
      ctx.lineWidth = hair; ctx.strokeStyle = ink(0.55 * sk.cards);
      passes.forEach((_, i) => { const c = cardOf(i); ctx.strokeRect(c.fx, c.fy, cw, ch); });
    }
    /* each card: its name and delay, and the motion graph of every element in it, on the time axis every card shares */
    if (sk.graph > 0) {
      passes.forEach((p, i) => {
        const k = EASE.out(order(i, sk.graph)); if (k <= 0) return;
        const c = cardOf(i), gr = c.gr, X = (t) => gr.x + (gr.w * t) / end, Y = (v) => gr.y + gr.h * (1 - v), d0 = P.start(p);
        ctx.globalAlpha = k;
        const hy = c.fy + pd + fs / 2, dl = `+${Math.round(d0)} ms`;
        ctx.fillStyle = ink(0.9); ctx.fillText(p.delays.length > 1 ? `${p.name} · ${p.delays.length}` : p.name, c.fx + pd, hy);
        ctx.fillStyle = green(1); ctx.fillText(dl, c.fx + cw - pd - ctx.measureText(dl).width, hy);
        if (gr.h > 12 * hair) {
          ctx.lineWidth = hair;
          for (let t = 0; t <= end; t += 100) { ctx.strokeStyle = green(t % 500 ? 0.1 : 0.24); ctx.beginPath(); ctx.moveTo(X(t), gr.y); ctx.lineTo(X(t), gr.y + gr.h); ctx.stroke(); }
          for (let q = 1; q < 4; q++) { ctx.strokeStyle = green(0.1); ctx.beginPath(); ctx.moveTo(gr.x, Y(q / 4)); ctx.lineTo(gr.x + gr.w, Y(q / 4)); ctx.stroke(); }
          ctx.strokeStyle = ink(0.4); ctx.strokeRect(gr.x, gr.y, gr.w, gr.h);
          ctx.strokeStyle = green(0.95); ctx.setLineDash([2 * hair, 2 * hair]); ctx.beginPath(); ctx.moveTo(X(d0), gr.y); ctx.lineTo(X(d0), gr.y + gr.h); ctx.stroke(); ctx.setLineDash([]);
          /* the curves draw in left to right; a pass with many elements draws each faintly, the first strongly */
          const tEnd = end * k, many = p.delays.length > 1;
          p.delays.forEach((d, e) => {
            ctx.strokeStyle = green(many && e ? 0.3 : 1); ctx.lineWidth = (many && e ? 1 : 1.6) * hair; ctx.lineJoin = 'round'; ctx.beginPath();
            for (let t = 0; t <= tEnd; t += end / 160) { const v = p.curve(d, t); t ? ctx.lineTo(X(t), Y(v)) : ctx.moveTo(X(t), Y(v)); }
            ctx.stroke(); ctx.lineJoin = 'miter';
          });
          if (sk.tau <= end) {
            ctx.strokeStyle = green(0.7); ctx.lineWidth = hair; ctx.beginPath(); ctx.moveTo(X(sk.tau), gr.y); ctx.lineTo(X(sk.tau), gr.y + gr.h); ctx.stroke();
            ctx.fillStyle = green(1); ctx.fillRect(X(sk.tau) - 2.5 * hair, Y(p.curve(p.delays[0], sk.tau)) - 2.5 * hair, 5 * hair, 5 * hair);
          }
        }
        ctx.globalAlpha = 1;
      });
    }
    drawPasses();
    ctx.restore();
    /* the timeline under the cell: one bar per stroke, from its delay to the end of its draw, and the playhead */
    if (sk.timeline > 0) {
      const bars = passes.flatMap((p) => p.key === 'lattice' ? [{ d: P.start(p), dur: Math.max(...p.delays) + p.dur - P.start(p), lat: true }] : p.delays.map((d) => ({ d, dur: p.dur })));
      const n = bars.length, vis = visible();
      const head = 22 * hair, foot = 18 * hair, gp = 12 * hair, below = vis.y + vis.h - (r.y + r.h) - 2 * gp, above = r.y - vis.y - 2 * gp;
      const room = Math.max(below, above), rowH = Math.max(1.5 * hair, Math.min(5 * hair, (room - head - foot) / n)), th = head + foot + n * rowH;
      const x = r.x, tw = r.w, y = below >= above ? r.y + r.h + gp : r.y - gp - th, k = EASE.out(sk.timeline);
      ctx.globalAlpha = k; ctx.fillStyle = page; ctx.fillRect(x, y, tw, th); ctx.strokeStyle = ink(0.4); ctx.lineWidth = hair; ctx.strokeRect(x, y, tw, th);
      ctx.fillStyle = green(1); ctx.fillText(`motion · timing · ${bp.parts.length} strokes · ${Math.round(st.step)} ms apart · ${STROKE_MS} ms each · in-out cubic`, x + 10 * hair, y + head / 2);
      const t2 = sk.tau <= end ? `${Math.round(sk.tau)} ms · shown at ${Math.round(sk.slow * 100)}%` : `${Math.round(end)} ms`; ctx.fillStyle = ink(0.7); ctx.fillText(t2, x + tw - 10 * hair - ctx.measureText(t2).width, y + head / 2);
      const bx = x + 10 * hair, bw = tw - 20 * hair, by = y + head, X = (t) => bx + (bw * t) / end;
      ctx.lineWidth = hair;
      for (let t = 0; t <= end; t += 100) { ctx.strokeStyle = green(t % 500 ? 0.08 : 0.2); ctx.beginPath(); ctx.moveTo(X(t), by); ctx.lineTo(X(t), by + n * rowH); ctx.stroke(); }
      bars.forEach((b, q) => {
        const ry = by + q * rowH, kk = clamp01((sk.timeline - (q / Math.max(1, n - 1)) * 0.3) / 0.7);
        ctx.fillStyle = green(0.2); ctx.fillRect(X(b.d), ry, (X(b.d + b.dur) - X(b.d)) * kk, rowH * 0.72);
        if (sk.tau <= end) { ctx.fillStyle = green(0.9); ctx.fillRect(X(b.d), ry, (X(b.d + b.dur) - X(b.d)) * clamp01((sk.tau - b.d) / b.dur), rowH * 0.72); }
      });
      ctx.fillStyle = ink(0.6); for (let t = 0; t <= end; t += 500) ctx.fillText(`${t}`, X(t) - (t ? ctx.measureText(`${t}`).width / 2 : 0), by + n * rowH + foot / 2);
      if (sk.tau <= end) { ctx.strokeStyle = green(1); ctx.lineWidth = 1.4 * hair; ctx.beginPath(); ctx.moveTo(X(sk.tau), by - 3 * hair); ctx.lineTo(X(sk.tau), by + n * rowH + 3 * hair); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  }

  /* ---------- casting: as in the Blocks film ---------- */
  const W = () => innerWidth;
  const smallFirst = (p, q) => Math.abs(p.fw * p.h - 60000) + (p.span === 2 ? 1e6 : 0) - (Math.abs(q.fw * q.h - 60000) + (q.span === 2 ? 1e6 : 0)) + (Math.abs(p.cx - W() * 0.28) - Math.abs(q.cx - W() * 0.28)) * 40;
  const bigFirst = (p, q) => q.fw * q.h * (1 - (0.5 * Math.abs(q.cx - W() / 2)) / W()) - p.fw * p.h * (1 - (0.5 * Math.abs(p.cx - W() / 2)) / W());
  async function open(prefer, opts = {}) {
    for (let n = 0; n < 16; n++) { const id = G.spawnWith(n < 6 ? { prefer, ...opts } : { ...opts }); if (id !== null) return id; await wait(250); }
    return null;
  }
  const built = async (id, extra = 400) => { for (let n = 0; n < 80; n++) { const ev = G.cell(id); if (!ev) return false; if (ev.st && ev.tin > ev.style.buildMs + extra && ev.openFrac > 0.99) return true; await wait(100); } return false; };

  async function closeUp() {
    G.tune('openW', 1.7); const id = await open(bigFirst, { keep: true }); G.tune('openW', 1.1);
    if (id === null) return;
    if (!(await built(id, 900))) return;
    await wait(500);
    G.auto(false);
    await push(id, 1800);                                                // in, as time stops
    Object.assign(sk, { id, latticeOut: false, latticeA: 1, tau: FULL });
    /* structure */
    await tween(600, (k) => { sk.veil = k; });
    await tween(1600, (k) => { sk.lattice = k; }, EASE.lin);
    await tween(900, (k) => { sk.margins = k; }, EASE.out);
    await tween(1600, (k) => { sk.trace = k; }, EASE.out);
    await tween(700, (k) => { sk.labels = k; }, EASE.out);
    await wait(2000);
    /* motion: the names, margins and lattice go; the drawing comes apart into its passes, each flying into its card */
    await tween(450, (k) => { sk.labels = 1 - k; sk.margins = 1 - k; });
    sk.paper = 1;                                                        // the film now draws the drawing itself, exactly as the print showed it
    await tween(1500, (k) => { sk.lib = k; sk.veil = 1 - k; sk.trace = 1 - k; sk.cards = k; sk.latticeA = 1 - k; });
    await tween(1400, (k) => { sk.graph = k; sk.timeline = k; }, EASE.lin);
    await wait(900);
    /* play the library: every pass takes itself apart, then rebuilds slowly under one playhead */
    const ev = G.cell(id), end = passesOf(ev.st, ev.fw, ev.fh, G.page()).end;
    await tween(500, (k) => { sk.tau = end * (1 - k); }, EASE.io);
    await wait(300);
    await tween(end / sk.slow, (k) => { sk.tau = end * k; }, EASE.lin);
    await wait(1600);
    sk.tau = FULL;
    /* undraw it all, then back out */
    await tween(800, (k) => { sk.graph = 1 - k; sk.timeline = 1 - k; });
    await tween(1300, (k) => { sk.lib = 1 - k; sk.cards = 1 - k; });
    await tween(400, (k) => { sk.paper = 1 - k; });                      // the passes laid together are the engine's own drawing, so this is seamless
    Object.assign(sk, { id: null, veil: 0, lattice: 0, margins: 0, trace: 0, labels: 0, paper: 0, lib: 0, cards: 0, graph: 0, timeline: 0 });
    await push(id, 1800, true);                                          // back out, as time returns
    G.release(id, 2400);
    G.auto(true);
  }

  async function film() {
    G.pick('4A'); G.auto(false); G.timeScale(1 / PACE);
    const v = view(); cam.z = 1; cam.fx = v.x; cam.fy = v.y; applyCam();
    G.arrive();                                                          // 1 the sheet draws in
    await wait(1300);
    await wait(2000);                                                    // 2 it breathes
    const a = await open(smallFirst);                                    // 3 a blueprint
    if (a !== null) await built(a, 200);
    await wait(900);
    for (;;) {
      await closeUp();                                                   // 4–7 the bigger cell, up close
      await wait(11000);                                                 // 8 the sheet carries on
      G.auto(false); await wait(1500);
    }
  }

  window.__film = { draw, state: sk, cam, passesOf };
  if (still) { G.pick('4A'); return; }                                   // reduced motion: the sheet at rest, no camera, no loop
  addEventListener('load', () => setTimeout(film, 200));
})();
</script>
