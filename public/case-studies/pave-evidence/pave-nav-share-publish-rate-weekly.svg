<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Pave weekly Share and Publish rates</title>
<desc id="chart-description">Share click rate among weekly active users was 0.1, 0.1, and 0.2 percent in the first three recorded buckets; 1.2 and 1.9 percent before July 16; 3.3 percent in the release week; 7.8 percent the following week; and about 10 to 12 percent from July 27 to September 11. Publish remained within about 19 to 27 percent.</desc>
