    <script>
      // This copy shows one slide only: "Three levels, one palette". Keys that would change slide are
      // swallowed, and any route away from slide 3 is put back.
      const home = "#light-layers-deck?slide=3";
      if (location.hash !== home) history.replaceState(null, "", home);
      const stay = () => { if (location.hash !== home) history.replaceState(null, "", home), dispatchEvent(new HashChangeEvent("hashchange")); };
      addEventListener("hashchange", stay, true);
      addEventListener("keydown", (event) => {
        const typing = event.target.closest?.("button, [role=button], input, textarea");
        if (["ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "End"].includes(event.key) || (event.key === " " && !typing)) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
