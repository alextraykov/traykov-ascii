<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">The cemetery loop procedural poster</title>
  <desc id="desc">A nearly black moonlit sky above a low cemetery hill, a stone path, five distinct headstones, and pale drifting fog.</desc>
  <defs>
    <radialGradient id="sky-glow" cx="70%" cy="20%" r="58%">
      <stop offset="0" stop-color="#dbe5db" stop-opacity=".16"/>
      <stop offset=".11" stop-color="#8a9aa0" stop-opacity=".055"/>
      <stop offset=".46" stop-color="#15212a" stop-opacity=".11"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05090d"/>
      <stop offset=".56" stop-color="#03070b"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="hill" x1=".56" y1="0" x2=".44" y2="1">
      <stop offset="0" stop-color="#172127"/>
      <stop offset=".42" stop-color="#0a1116"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#405058"/>
      <stop offset="1" stop-color="#11191e"/>
    </linearGradient>
    <radialGradient id="moon-halo">
      <stop offset="0" stop-color="#d5d4c5" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#5f6e6c" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="fog" x="-16%" y="-80%" width="132%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <mask id="moon-crescent">
      <rect width="1672" height="941" fill="#000"/>
      <circle cx="1172" cy="174" r="44" fill="#fff"/>
      <circle cx="1151" cy="161" r="45" fill="#000"/>
    </mask>
  </defs>

  <rect width="1672" height="941" fill="url(#sky)"/>
  <rect width="1672" height="941" fill="url(#sky-glow)"/>
  <circle cx="1172" cy="174" r="76" fill="url(#moon-halo)"/>
